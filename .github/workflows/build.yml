# Builds SCRAPFALL2.apk (signed with the permanent release key from repo secrets) and SCRAPFALL2.exe.
# Push a tag like v0.2.0 (or press "Run workflow"): both appear on the private release and as artifacts.
name: Build APK and EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME / ANDROID_SDK_ROOT).

      - name: Godot and export templates (Android + Windows)
        run: |
          base="https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable"
          curl -sSL -o godot.zip "${base}&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o templates.tpz "${base}&slug=export_templates.tpz&platform=templates"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/android_*' 'templates/windows_release_x86_64.exe' 'templates/version.txt' -d "$dest"
          rm templates.tpz godot.zip
          ls "$dest"

      - name: Signing keys
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing secret ANDROID_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Tell Godot where Android and Java are
        run: |
          echo "SDK: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"; ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" | tail -3
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Export APK and EXE
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p export
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-release "Android" export/SCRAPFALL2.apk
          ./godot --headless --path . --export-release "Windows Desktop" export/SCRAPFALL2.exe
          rm -f release.keystore
          ls -la export

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the release below is what players get; a full artifact quota must not block it
        with:
          name: SCRAPFALL
          retention-days: 3
          path: |
            export/SCRAPFALL2.apk
            export/SCRAPFALL2.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            export/SCRAPFALL2.apk
            export/SCRAPFALL2.exe
